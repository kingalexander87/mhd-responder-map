<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MHD Safety Responder Map</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;font-size:13px;overflow:hidden}
#app{display:flex;flex-direction:column;height:100vh}
#toolbar{background:#1F3864;color:#fff;padding:8px 12px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;z-index:10}
#toolbar h1{font-size:14px;font-weight:700;margin-right:6px;white-space:nowrap}
.filter-group{display:flex;align-items:center;gap:4px}
.filter-group label{font-size:11px;opacity:.8;white-space:nowrap}
select,input[type=text]{font-size:12px;padding:4px 7px;border-radius:4px;border:none;background:#2F5496;color:#fff;cursor:pointer}
select option{background:#1F3864}
input[type=text]{background:#2F5496;color:#fff}
input[type=text]::placeholder{color:rgba(255,255,255,0.5)}
#zip-input{width:110px}
#zip-btn{background:#27AE60;color:#fff;border:none;padding:4px 10px;border-radius:4px;cursor:pointer;font-size:12px;font-weight:700}
#zip-btn:hover{background:#1E8449}
.toggle-wrap{display:flex;align-items:center;gap:5px;font-size:11px;opacity:.9}
.toggle{position:relative;width:34px;height:18px}
.toggle input{opacity:0;width:0;height:0}
.slider{position:absolute;cursor:pointer;top:0;left:0;right:0;bottom:0;background:#2F5496;border-radius:18px;transition:.3s}
.slider:before{position:absolute;content:"";height:12px;width:12px;left:3px;bottom:3px;background:white;border-radius:50%;transition:.3s}
input:checked+.slider{background:#27AE60}
input:checked+.slider:before{transform:translateX(16px)}
#count-badge{background:rgba(255,255,255,0.15);border-radius:12px;padding:2px 10px;font-size:11px;white-space:nowrap;margin-left:auto}
#map-container{flex:1;position:relative}
#map{width:100%;height:100%}
#legend{position:absolute;bottom:28px;left:10px;background:rgba(255,255,255,0.96);border-radius:8px;padding:10px 12px;font-size:11px;z-index:5;box-shadow:0 2px 8px rgba(0,0,0,0.15);min-width:175px}
#legend h4{font-size:11px;font-weight:700;margin-bottom:5px;color:#1F3864}
.legend-item{display:flex;align-items:center;gap:6px;margin-bottom:3px}
.legend-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0}
.legend-star{width:14px;height:14px;flex-shrink:0;font-size:14px;line-height:1}
.legend-div{border-top:1px solid #ddd;margin:5px 0}
#zip-results{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:#fff;border-radius:8px;box-shadow:0 4px 16px rgba(0,0,0,0.2);z-index:10;min-width:300px;max-width:360px;display:none}
#zip-results-header{background:#1F3864;color:#fff;padding:10px 14px;border-radius:8px 8px 0 0;display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:700}
#zip-close{cursor:pointer;font-size:18px;line-height:1}
#zip-results-body{padding:10px 14px}
.zip-row{padding:8px 0;border-bottom:1px solid #f0f0f0;font-size:12px}
.zip-row:last-child{border-bottom:none}
.zip-name{font-weight:700;color:#1F3864;font-size:13px;position:relative;display:inline-block}
.zip-name.has-info{cursor:help;border-bottom:1px dotted #888}
.zip-tooltip{display:none;position:absolute;left:0;top:calc(100% + 8px);background:#1F3864;color:#fff;padding:8px 11px;border-radius:5px;font-size:11px;font-weight:400;white-space:normal;width:260px;z-index:200;box-shadow:0 3px 12px rgba(0,0,0,0.3);line-height:1.45;pointer-events:none}
.zip-name.has-info:hover .zip-tooltip{display:block}
.zip-tooltip:before{content:"";position:absolute;left:14px;bottom:100%;border:6px solid transparent;border-bottom-color:#1F3864}
.zip-tooltip-label{display:block;color:#FFD700;font-weight:700;font-size:9px;letter-spacing:0.6px;margin-bottom:2px}
.zip-tooltip-flag{margin-top:6px;padding-top:6px;border-top:1px solid rgba(255,255,255,0.25)}
.zip-dist{color:#27AE60;font-weight:700;float:right}
.zip-detail{color:#666;margin-top:2px}
.badge{display:inline-block;padding:2px 6px;border-radius:10px;font-size:10px;font-weight:700;margin:1px;background:#E8F4FD;color:#1F3864}
.inactive-badge{background:#f0f0f0;color:#999}
.search-wrap{position:relative}
#name-dropdown{position:absolute;top:calc(100% + 3px);left:0;background:#fff;border-radius:5px;box-shadow:0 4px 14px rgba(0,0,0,0.28);min-width:240px;max-height:300px;overflow-y:auto;z-index:50;display:none}
.dd-item{padding:7px 11px;cursor:pointer;color:#1F3864;font-size:12px;border-bottom:1px solid #f0f0f0}
.dd-item:last-child{border-bottom:none}
.dd-item:hover,.dd-item.active{background:#E8F4FD}
.dd-name{font-weight:700;color:#1F3864;font-size:12px}
.dd-detail{color:#666;font-size:10px;margin-top:1px}
.dd-empty{padding:10px 11px;color:#999;font-size:11px;font-style:italic}
.zip-directions{display:inline-block;background:#27AE60;color:#fff;padding:2px 8px;border-radius:4px;text-decoration:none;font-weight:700;font-size:10px;margin-top:4px;letter-spacing:0.3px}
.zip-directions:hover{background:#1E8449}
</style>
</head>
<body>
<div id="app">

    <h1>&#x1F5FA; MHD Safety Responder Map</h1>

      <label>Region</label>

    <div id="legend">

      <div class="legend-div"></div>
      <h4>Responder Rating</h4>
      <div class="legend-item"><div class="legend-dot" style="background:#1E8449"></div><span>7 &mdash; Full capacity</span></div>
      <div class="legend-item"><div class="legend-dot" style="background:#27AE60"></div><span>6 &mdash; Near-full</span></div>
      <div class="legend-item"><div class="legend-dot" style="background:#F4D03F"></div><span>5 &mdash; Mid-tier</span></div>
      <div class="legend-item"><div class="legend-dot" style="background:#E67E22"></div><span>4 &mdash; Basic</span></div>
      <div class="legend-item"><div class="legend-dot" style="background:#E74C3C"></div><span>3 &mdash; Audio/Fit only</span></div>
    </div>
    <div id="zip-results">
      <div id="zip-results-header">
        <span id="zip-title">Nearest Responders</span>
        <span id="zip-close">&#x2715;</span>
      </div>
      <div id="zip-results-body"></div>
    </div>
  </div>
</div>
<script>

const SHEET_ID = "14VbFR3dKRCb2LoalZQxTYMSN8g_IXhmCDQci3112D50";

const RATING_COLORS = {7:"#1E8449",6:"#27AE60",5:"#F4D03F",4:"#E67E22",3:"#E74C3C"};
const COORDS = {

let map, allTechs=[], markers=[], openInfoWindow=null, searchMarker=null, searchInfoWindow=null;
function isInactive(t){ return t.notes&&t.notes.toLowerCase().includes("on leave"); }
function isRM(t){ return t.title&&t.title.toLowerCase().includes("regional manager"); }
function isSDM(t){ return t.title&&t.title.toLowerCase().includes("service delivery"); }
function parseServices(row){
  const s=[];
  if(row[9]==="Yes") s.push("Audio");
  if(row[11]==="Yes") s.push("QN Fit");
  if(row[12]==="Yes") s.push("QL Fit");
  if(row[13]==="Yes") s.push("PFT");
  if(row[15]==="Yes") s.push("Air Monitor");
  if(row[16]==="Yes") s.push("Dosimetry");
  if(row[17]==="Yes") s.push("NLS");
  if(row[18]==="Yes") s.push("ENLS");
  return s;
}
function techFromRow(row){
  return {
    name:row[0]||"",region:row[1]||"",state:row[2]||"",srtm:row[3]||"",bilingual:row[4]||"",
    title:row[5]||"",phone:row[6]||"",email:row[7]||"",address:row[8]||"",
    audExp:row[10]||"",nioshExp:row[14]||"",rating:parseInt(row[19])||0,
    notes:row[20]||"",flags:row[21]||"",services:parseServices(row),
  };
}
async function loadData(){
  try{
    const r=await fetch(SHEET_URL);
    const d=await r.json();
    if(!d.values) return [];
    return d.values.filter(r=>r[0]).map(techFromRow);
  }catch(e){ console.error(e); return []; }
}
function makePinSVG(tech){
  const rm=isRM(tech), sdm=isSDM(tech), inactive=isInactive(tech);
  const opacity=inactive?"0.45":"1";
  if(rm||sdm){
    const c=rm?"#2E86C1":"#A569BD";
    return `<svg xmlns="http://www.w3.org/2000/svg" width="46" height="46" viewBox="0 0 46 46" opacity="${opacity}">
      <polygon points="23,2 28,18 45,18 32,29 37,45 23,34 9,45 14,29 1,18 18,18" fill="${c}" stroke="#fff" stroke-width="2"/>
      <text x="23" y="28" text-anchor="middle" font-size="10" font-weight="bold" fill="#fff" font-family="Arial">${tech.rating}</text>
    </svg>`;
  }
  const c=inactive?"#bbb":RATING_COLORS[tech.rating]||"#999";
  const tc=(!inactive&&tech.rating===5)?"#444":"#fff";
  return `<svg xmlns="http://www.w3.org/2000/svg" width="34" height="44" viewBox="0 0 34 44" opacity="${opacity}">
    <path d="M17 1C8.163 1 1 8.163 1 17c0 11 16 26 16 26S33 28 33 17C33 8.163 25.837 1 17 1z" fill="${c}" stroke="#fff" stroke-width="2"/>
    <text x="17" y="22" text-anchor="middle" font-size="12" font-weight="bold" fill="${tc}" font-family="Arial">${tech.rating}</text>
  </svg>`;
}
function makeSearchPinSVG(){
  return `<svg xmlns="http://www.w3.org/2000/svg" width="42" height="54" viewBox="0 0 42 54">
    <defs>
      <filter id="ds" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-opacity="0.4"/>
      </filter>
    </defs>
    <path d="M21 1C10.51 1 2 9.51 2 20c0 13.5 19 33 19 33s19-19.5 19-33C40 9.51 31.49 1 21 1z" fill="#E74C3C" stroke="#fff" stroke-width="2.5" filter="url(#ds)"/>
    <circle cx="21" cy="20" r="7" fill="#fff"/>
    <circle cx="21" cy="20" r="3.5" fill="#E74C3C"/>
  </svg>`;
}
function makeMarker(tech){
  const coords=COORDS[tech.name];
  if(!coords) return null;
  const large=isRM(tech)||isSDM(tech);
  const icon={
    url:'data:image/svg+xml;charset=UTF-8,'+encodeURIComponent(makePinSVG(tech)),
    scaledSize:large?new google.maps.Size(46,46):new google.maps.Size(34,44),
    anchor:large?new google.maps.Point(23,44):new google.maps.Point(17,44),
  };
  const marker=new google.maps.Marker({
    position:coords, map, icon, title:tech.name,
    zIndex:large?10:1, visible:false,
  });
  const rc=isRM(tech)?"#2E86C1":isSDM(tech)?"#A569BD":"#1F3864";
  const servicesBadges=tech.services.map(s=>`<span class="badge">${s}</span>`).join('');
  const bilingualBadge=tech.bilingual==="Yes"?`<span class="badge" style="background:#E8F8E8;color:#1a6b1a">Bilingual</span>`:'';
  const inactiveBadge=isInactive(tech)?`<span class="badge inactive-badge">On Leave</span>`:'';
  const flagHtml=tech.flags?`<div style="background:#FFF9C4;border:1px solid #F4D03F;border-radius:4px;padding:5px 7px;font-size:11px;color:#7D6608;margin-top:6px">&#9888; ${tech.flags}</div>`:'';
  const iw=new google.maps.InfoWindow({maxWidth:270,content:`
    <div style="font-family:Arial;font-size:12px;max-width:250px;line-height:1.5">
      <div style="font-weight:700;font-size:14px;color:${rc};margin-bottom:3px">${tech.name} ${inactiveBadge}</div>
      <div style="color:#555;margin-bottom:5px">${tech.title}${tech.region?' &middot; '+tech.region:''}</div>
      ${tech.srtm?`<div style="color:#777;font-size:11px;margin-bottom:5px">SRTM: <strong>${tech.srtm}</strong></div>`:''}
      <div style="margin-bottom:5px"><strong>Rating:</strong> <span style="color:${RATING_COLORS[tech.rating]||'#999'};font-weight:700;font-size:14px">${tech.rating}/7</span></div>
      ${tech.phone?`<div style="margin-bottom:2px">&#128222; <a href="tel:${tech.phone}" style="color:#1F3864">${tech.phone}</a></div>`:''}
      ${tech.email?`<div style="margin-bottom:5px;word-break:break-all">&#9993; <a href="mailto:${tech.email}" style="color:#1F3864">${tech.email}</a></div>`:''}
      ${tech.address?`<div style="margin-bottom:5px;color:#666;font-size:11px">&#128205; ${tech.address}</div>`:''}
      <div style="margin-bottom:6px"><a href="${directionsURL(tech)}" target="_blank" rel="noopener" style="display:inline-block;background:#27AE60;color:#fff;padding:4px 10px;border-radius:4px;text-decoration:none;font-weight:700;font-size:11px">&#129517; Get Directions</a></div>
      <div>${servicesBadges}${bilingualBadge}</div>
      ${tech.audExp&&tech.audExp!=="Active"?`<div style="font-size:10px;color:#888;margin-top:4px">Audio exp: ${tech.audExp}</div>`:''}
      ${tech.nioshExp&&tech.nioshExp!=="Active"?`<div style="font-size:10px;color:#888">NIOSH exp: ${tech.nioshExp}</div>`:''}
      ${tech.notes?`<div style="margin-top:6px;color:#555;font-size:11px;font-style:italic;border-top:1px solid #eee;padding-top:5px">&#128203; ${tech.notes}</div>`:''}
      ${flagHtml}
    </div>`});
  marker.addListener('click',()=>{
    if(openInfoWindow) openInfoWindow.close();
    iw.open(map,marker);
    openInfoWindow=iw;
  });
  return {marker,tech};
}
function populateRegions(){
  const regions=[...new Set(allTechs.map(t=>t.region).filter(Boolean))].sort();
  const sel=document.getElementById('f-region');
  regions.forEach(r=>{const o=document.createElement('option');o.value=r;o.textContent=r;sel.appendChild(o);});
}
function applyFilters(){
  const region=document.getElementById('f-region').value;
  const service=document.getElementById('f-service').value;
  const minRating=parseInt(document.getElementById('f-rating').value)||0;
  const bilingual=document.getElementById('f-bilingual').value;
  const search=document.getElementById('search').value.toLowerCase().trim();
  const showInactive=document.getElementById('toggle-inactive').checked;
  let visible=0;
  markers.forEach(({marker,tech})=>{
    const show=(showInactive||!isInactive(tech))&&
      (!region||tech.region===region)&&
      (!service||tech.services.includes(service))&&
      (tech.rating>=minRating)&&
      (!bilingual||tech.bilingual===bilingual)&&
      (!search||tech.name.toLowerCase().includes(search));
    marker.setVisible(show);
    if(show) visible++;
  });
  document.getElementById('count-badge').textContent=`${visible} shown`;
}
function haversine(lat1,lng1,lat2,lng2){
  const R=3958.8,dLat=(lat2-lat1)*Math.PI/180,dLng=(lng2-lng1)*Math.PI/180;
  const a=Math.sin(dLat/2)**2+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2;
  return Math.round(R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a)));
}
function clearSearchMarker(){
  if(searchMarker){ searchMarker.setMap(null); searchMarker=null; }
  if(searchInfoWindow){ searchInfoWindow.close(); searchInfoWindow=null; }
}
function directionsURL(tech){
  const coords=COORDS[tech.name];
  const dest=tech.address?tech.address:(coords?`${coords.lat},${coords.lng}`:tech.name);
  return `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(dest)}`;
}
function showNameDropdown(){
  const q=document.getElementById('search').value.toLowerCase().trim();
  const dd=document.getElementById('name-dropdown');
  if(!q){dd.style.display='none';dd.innerHTML='';return;}
  const matches=markers.filter(({tech})=>tech.name.toLowerCase().includes(q)).slice(0,8);
  if(matches.length===0){
    dd.innerHTML='<div class="dd-empty">No matches</div>';
    dd.style.display='block';
    return;
  }
  const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  dd.innerHTML=matches.map(({tech})=>{
    const detail=[tech.title,tech.region].filter(Boolean).join(' &middot; ');
    return `<div class="dd-item" data-name="${esc(tech.name)}">
      <div class="dd-name">${tech.name}</div>
      <div class="dd-detail">${detail||'&nbsp;'}</div>
    </div>`;
  }).join('');
  dd.style.display='block';
}
function selectResponder(name){
  const match=markers.find(({tech})=>tech.name===name);
  if(!match) return;
  const {marker,tech}=match;
  document.getElementById('search').value='';
  applyFilters();
  marker.setVisible(true);
  const coords=COORDS[tech.name];
  if(coords){
    map.panTo(coords);
    map.setZoom(9);
  }
  google.maps.event.trigger(marker,'click');
  document.getElementById('name-dropdown').style.display='none';
}
async function findNearest(){
  const zip=document.getElementById('zip-input').value.trim();
  if(!zip||zip.length<5) return;
  try{
    const r=await fetch(`https://api.zippopotam.us/us/${zip}`);
    if(!r.ok){alert('Could not find that zip code.');return;}
    const d=await r.json();
    const lat=parseFloat(d.places[0].latitude);
    const lng=parseFloat(d.places[0].longitude);
    const placeName=d.places[0]['place name']||'';
    const stateAbbr=d.places[0]['state abbreviation']||'';
    const locLabel=placeName?`${placeName}, ${stateAbbr}`:zip;

    clearSearchMarker();
    searchMarker=new google.maps.Marker({
      position:{lat,lng},
      map,
      icon:{
        url:'data:image/svg+xml;charset=UTF-8,'+encodeURIComponent(makeSearchPinSVG()),
        scaledSize:new google.maps.Size(42,54),
        anchor:new google.maps.Point(21,54),
      },
      title:`Searched: ${zip} (${locLabel})`,
      zIndex:9999,
      animation:google.maps.Animation.DROP,
    });
    searchInfoWindow=new google.maps.InfoWindow({content:`
      <div style="font-family:Arial;font-size:12px;line-height:1.5">
        <div style="font-weight:700;font-size:13px;color:#E74C3C;margin-bottom:2px">&#128205; Searched Location</div>
        <div style="color:#333"><strong>${zip}</strong></div>
        <div style="color:#666">${locLabel}</div>
      </div>`});
    searchMarker.addListener('click',()=>{
      if(openInfoWindow) openInfoWindow.close();
      searchInfoWindow.open(map,searchMarker);
      openInfoWindow=searchInfoWindow;
    });

    const showInactive=document.getElementById('toggle-inactive').checked;
    const service=document.getElementById('f-service').value;
    const ranked=markers
      .filter(({tech})=>COORDS[tech.name]&&(showInactive||!isInactive(tech))&&!isRM(tech)&&!isSDM(tech)&&(!service||tech.services.includes(service)))
      .map(({tech})=>({...tech,dist:haversine(lat,lng,COORDS[tech.name].lat,COORDS[tech.name].lng)}))
      .sort((a,b)=>a.dist-b.dist).slice(0,5);
    document.getElementById('zip-title').textContent=service?`Nearest ${service} to ${zip}`:`Nearest to ${zip}`;
    const escHtml=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    document.getElementById('zip-results-body').innerHTML=ranked.map(t=>{
      const hasInfo=!!(t.notes||t.flags);
      const parts=[];
      if(t.notes) parts.push(`<span class="zip-tooltip-label">NOTES</span>${escHtml(t.notes)}`);
      if(t.flags) parts.push(`<div class="zip-tooltip-flag"><span class="zip-tooltip-label">FLAGS</span>${escHtml(t.flags)}</div>`);
      const tooltip=hasInfo?`<span class="zip-tooltip">${parts.join('')}</span>`:'';
      const cls=hasInfo?'zip-name has-info':'zip-name';
      return `
      <div class="zip-row">
        <span class="${cls}">${t.name}${tooltip}</span><span class="zip-dist">${t.dist} mi</span>
        <div class="zip-detail">${t.title} &middot; Rating ${t.rating}/7 &middot; ${t.region}</div>
        ${t.srtm?`<div class="zip-detail">SRTM: <strong>${t.srtm}</strong></div>`:''}
        <div class="zip-detail">${t.phone||'No phone on file'}</div>
        <div>${t.services.slice(0,4).map(s=>`<span class="badge">${s}</span>`).join('')}${t.services.length>4?`<span class="badge">+${t.services.length-4}</span>`:''}${isInactive(t)?`<span class="badge inactive-badge">On Leave</span>`:''}</div>
        <div><a class="zip-directions" href="${directionsURL(t)}" target="_blank" rel="noopener">&#129517; Get Directions</a></div>
      </div>`;}).join('');
    document.getElementById('zip-results').style.display='block';
    map.setZoom(7);
    map.panTo({lat,lng});
    // Offset the map so the dropped pin sits to the right of the results panel, not behind it
    map.panBy(-210,0);
  }catch(e){alert('Error geocoding zip code.');}
}
async function initMap(){
  map=new google.maps.Map(document.getElementById('map'),{
    center:{lat:37.5,lng:-95},zoom:4,
    mapTypeControl:false,streetViewControl:false,fullscreenControl:true,
    styles:[{featureType:"poi",stylers:[{visibility:"off"}]},{featureType:"transit",stylers:[{visibility:"off"}]}]
  });
  allTechs=await loadData();
  if(!allTechs.length){document.getElementById('count-badge').textContent='Sheet error — check sharing settings';return;}
  populateRegions();
  markers=allTechs.map(makeMarker).filter(Boolean);
  applyFilters();
  ['f-region','f-service','f-rating','f-bilingual'].forEach(id=>document.getElementById(id).addEventListener('change',applyFilters));
  document.getElementById('search').addEventListener('input',()=>{applyFilters();showNameDropdown();});
  document.getElementById('search').addEventListener('focus',showNameDropdown);
  document.getElementById('name-dropdown').addEventListener('click',e=>{
    const item=e.target.closest('.dd-item');
    if(item) selectResponder(item.getAttribute('data-name'));
  });
  document.addEventListener('click',e=>{
    if(!e.target.closest('.search-wrap')) document.getElementById('name-dropdown').style.display='none';
  });
  document.getElementById('toggle-inactive').addEventListener('change',applyFilters);
  document.getElementById('zip-btn').addEventListener('click',findNearest);
  document.getElementById('zip-input').addEventListener('keydown',e=>{if(e.key==='Enter')findNearest();});
  document.getElementById('zip-close').addEventListener('click',()=>{
    document.getElementById('zip-results').style.display='none';
    clearSearchMarker();
  });
  map.addListener('click',()=>{if(openInfoWindow){openInfoWindow.close();openInfoWindow=null;}});
}
window.initMap=initMap;
</script>
<script async defer
  src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCXalP4vszPKPOVN9Y5pzNbfjJjF4VN7VY&callback=initMap">
</script>
