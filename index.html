<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MHD Safety Responder Map</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;font-size:13px;background:#f5f7fa;overflow:hidden}
#app{display:flex;flex-direction:column;height:100vh}
#toolbar{background:#1F3864;color:#fff;padding:10px 14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;z-index:10}
#toolbar h1{font-size:15px;font-weight:700;margin-right:8px;white-space:nowrap}
.filter-group{display:flex;align-items:center;gap:5px}
.filter-group label{font-size:11px;opacity:.8;white-space:nowrap}
select,input[type=text]{font-size:12px;padding:4px 8px;border-radius:4px;border:none;background:#2F5496;color:#fff;cursor:pointer}
select option{background:#1F3864}
#search{background:#2F5496;color:#fff;width:150px}
#search::placeholder{color:rgba(255,255,255,0.5)}
#map-container{flex:1;position:relative}
#map{width:100%;height:100%}
#legend{position:absolute;bottom:30px;left:10px;background:rgba(255,255,255,0.96);border-radius:8px;padding:10px 12px;font-size:11px;z-index:5;box-shadow:0 2px 8px rgba(0,0,0,0.15)}
#legend h4{font-size:11px;font-weight:700;margin-bottom:6px;color:#1F3864}
.legend-item{display:flex;align-items:center;gap:6px;margin-bottom:3px}
.legend-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0}
#count-badge{background:rgba(255,255,255,0.2);border-radius:12px;padding:2px 10px;font-size:11px;white-space:nowrap;margin-left:auto}
.badge{display:inline-block;padding:2px 7px;border-radius:12px;font-size:10px;font-weight:700;margin:2px 2px 2px 0;background:#E8F4FD;color:#1F3864}
.flag-box{background:#FFF9C4;border:1px solid #F4D03F;border-radius:4px;padding:6px 8px;font-size:11px;color:#7D6608;margin-top:8px}
#loading{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(255,255,255,0.95);border-radius:10px;padding:24px 32px;text-align:center;box-shadow:0 4px 20px rgba(0,0,0,0.15);z-index:20}
#loading h3{color:#1F3864;font-size:15px;margin-bottom:8px}
#loading p{color:#666;font-size:12px}
#progress-bar{width:220px;height:6px;background:#E0E0E0;border-radius:3px;margin:12px auto 0;overflow:hidden}
#progress-fill{height:100%;background:#27AE60;border-radius:3px;width:0%;transition:width 0.3s}
</style>
</head>
<body>
<div id="app">
  <div id="toolbar">
    <h1>&#x1F5FA; MHD Safety Responder Map</h1>
    <div class="filter-group">
      <label>Region</label>
      <select id="f-region"><option value="">All regions</option></select>
    </div>
    <div class="filter-group">
      <label>Service</label>
      <select id="f-service">
        <option value="">All services</option>
        <option value="Audio">Audio</option>
        <option value="QN Fit">QN Fit</option>
        <option value="QL Fit">QL Fit</option>
        <option value="PFT">PFT</option>
        <option value="Air Monitor">Air Monitor</option>
        <option value="Dosimetry">Dosimetry</option>
        <option value="NLS">NLS</option>
        <option value="ENLS">ENLS</option>
      </select>
    </div>
    <div class="filter-group">
      <label>Min rating</label>
      <select id="f-rating">
        <option value="0">Any</option>
        <option value="6">6+</option>
        <option value="7">7+</option>
        <option value="8">8+</option>
        <option value="9">9 only</option>
      </select>
    </div>
    <div class="filter-group">
      <label>Bilingual</label>
      <select id="f-bilingual">
        <option value="">All</option>
        <option value="Yes">Yes only</option>
      </select>
    </div>
    <div class="filter-group">
      <input type="text" id="search" placeholder="Search name...">
    </div>
    <span id="count-badge">Loading...</span>
  </div>

  <div id="map-container">
    <div id="map"></div>

    <div id="loading">
      <h3>Loading Responder Map</h3>
      <p id="loading-msg">Fetching technician data...</p>
      <div id="progress-bar"><div id="progress-fill"></div></div>
    </div>

    <div id="legend">
      <h4>Rating</h4>
      <div class="legend-item"><div class="legend-dot" style="background:#1E8449"></div><span>9 &mdash; Full capability</span></div>
      <div class="legend-item"><div class="legend-dot" style="background:#27AE60"></div><span>8 &mdash; Near-full</span></div>
      <div class="legend-item"><div class="legend-dot" style="background:#82E0AA"></div><span>7 &mdash; Strong</span></div>
      <div class="legend-item"><div class="legend-dot" style="background:#F4D03F"></div><span>6 &mdash; Solid mid-tier</span></div>
      <div class="legend-item"><div class="legend-dot" style="background:#F0B27A"></div><span>4&ndash;5 &mdash; Basic+</span></div>
      <div class="legend-item"><div class="legend-dot" style="background:#E74C3C"></div><span>3 &mdash; Audio/Fit only</span></div>
    </div>
  </div>
</div>

<script>
const SHEET_ID = "14VbFR3dKRCb2LoalZQxTYMSN8g_IXhmCDQci3112D50";
const API_KEY  = "AIzaSyDYd59Nq9q2ZA26IQdP0d_2N88HTIiMG1M";
const SHEET_URL = `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/MASTER!A3:U200?key=${API_KEY}`;

const RATING_COLORS = {9:"#1E8449",8:"#27AE60",7:"#82E0AA",6:"#F4D03F",5:"#F39C12",4:"#F0B27A",3:"#E74C3C"};

let map, geocoder, allTechs=[], markers=[], openInfoWindow=null;

function ratingColor(r){ return RATING_COLORS[r] || "#999"; }

function parseServices(row){
  const s=[];
  if(row[8]==="Yes") s.push("Audio");
  if(row[10]==="Yes") s.push("QN Fit");
  if(row[11]==="Yes") s.push("QL Fit");
  if(row[12]==="Yes") s.push("PFT");
  if(row[14]==="Yes") s.push("Air Monitor");
  if(row[15]==="Yes") s.push("Dosimetry");
  if(row[16]==="Yes") s.push("NLS");
  if(row[17]==="Yes") s.push("ENLS");
  return s;
}

function techFromRow(row){
  return {
    name:      row[0]||"",
    region:    row[1]||"",
    state:     row[2]||"",
    bilingual: row[3]||"",
    title:     row[4]||"",
    phone:     row[5]||"",
    email:     row[6]||"",
    address:   row[7]||"",
    audExp:    row[9]||"",
    nioshExp:  row[13]||"",
    rating:    parseInt(row[18])||0,
    notes:     row[19]||"",
    flags:     row[20]||"",
    services:  parseServices(row),
  };
}

async function loadData(){
  try{
    const r = await fetch(SHEET_URL);
    const d = await r.json();
    if(!d.values) return [];
    return d.values.filter(r => r[0] && r[7]).map(techFromRow);
  } catch(e){
    console.error("Sheet load error:", e);
    return [];
  }
}

function makePinSVG(rating){
  const color = ratingColor(rating);
  const textColor = (rating >= 6 && rating <= 7) ? "#555" : "#fff";
  return `<svg xmlns="http://www.w3.org/2000/svg" width="34" height="44" viewBox="0 0 34 44">
    <path d="M17 1C8.163 1 1 8.163 1 17c0 11 16 26 16 26S33 28 33 17C33 8.163 25.837 1 17 1z" fill="${color}" stroke="#fff" stroke-width="2"/>
    <text x="17" y="22" text-anchor="middle" font-size="12" font-weight="bold" fill="${textColor}" font-family="Arial">${rating}</text>
  </svg>`;
}

function makeMarker(tech){
  const icon = {
    url: 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(makePinSVG(tech.rating)),
    scaledSize: new google.maps.Size(34, 44),
    anchor: new google.maps.Point(17, 44),
  };

  const marker = new google.maps.Marker({
    position: {lat:0, lng:0},
    map: map,
    icon: icon,
    title: tech.name,
    visible: false,
  });

  const servicesBadges = tech.services.map(s=>`<span class="badge">${s}</span>`).join('');
  const flagHtml = tech.flags ? `<div class="flag-box">&#9888; ${tech.flags}</div>` : '';
  const bilingualBadge = tech.bilingual==="Yes" ? `<span class="badge" style="background:#E8F8E8;color:#1E6B1E">Bilingual</span>` : '';

  const iwContent = `
    <div style="font-family:Arial;font-size:12px;max-width:240px;line-height:1.5">
      <div style="font-weight:700;font-size:14px;color:#1F3864;margin-bottom:4px">${tech.name}</div>
      <div style="color:#555;margin-bottom:6px">${tech.title}${tech.region ? ' &middot; '+tech.region : ''}</div>
      <div style="margin-bottom:6px">
        <strong>Rating:</strong>
        <span style="color:${ratingColor(tech.rating)};font-weight:700;font-size:14px"> ${tech.rating}/9</span>
      </div>
      ${tech.phone ? `<div style="margin-bottom:3px">&#128222; <a href="tel:${tech.phone}" style="color:#1F3864">${tech.phone}</a></div>` : ''}
      ${tech.email ? `<div style="margin-bottom:6px;word-break:break-all">&#9993; <a href="mailto:${tech.email}" style="color:#1F3864">${tech.email}</a></div>` : ''}
      ${tech.address ? `<div style="margin-bottom:6px;color:#555;font-size:11px">&#128205; ${tech.address}</div>` : ''}
      <div style="margin-bottom:4px">${servicesBadges}${bilingualBadge}</div>
      ${tech.audExp && tech.audExp !== "Active" ? `<div style="font-size:10px;color:#888;margin-top:4px">Audio cert exp: ${tech.audExp}</div>` : ''}
      ${tech.nioshExp && tech.nioshExp !== "Active" ? `<div style="font-size:10px;color:#888">NIOSH cert exp: ${tech.nioshExp}</div>` : ''}
      ${tech.notes ? `<div style="margin-top:6px;color:#555;font-size:11px;font-style:italic;border-top:1px solid #eee;padding-top:6px">&#128203; ${tech.notes}</div>` : ''}
      ${flagHtml}
    </div>`;

  const iw = new google.maps.InfoWindow({ content: iwContent, maxWidth: 260 });

  marker.addListener('click', ()=>{
    if(openInfoWindow) openInfoWindow.close();
    iw.open(map, marker);
    openInfoWindow = iw;
  });

  return { marker, tech, iw };
}

async function geocodeAll(techMarkers){
  const delay = ms => new Promise(r => setTimeout(r, ms));
  const total = techMarkers.length;
  let done = 0;

  for(let i = 0; i < techMarkers.length; i++){
    const {marker, tech} = techMarkers[i];
    await new Promise(resolve => {
      geocoder.geocode({ address: tech.address }, (results, status) => {
        if(status === 'OK'){
          marker.setPosition(results[0].geometry.location);
          marker.setVisible(true);
        }
        resolve();
      });
    });
    done++;
    const pct = Math.round((done/total)*100);
    document.getElementById('progress-fill').style.width = pct + '%';
    document.getElementById('loading-msg').textContent = `Placing pins... ${done} of ${total}`;
    if(i % 4 === 3) await delay(250);
  }
}

function populateRegions(){
  const regions = [...new Set(allTechs.map(t=>t.region).filter(Boolean))].sort();
  const sel = document.getElementById('f-region');
  regions.forEach(r=>{
    const o = document.createElement('option');
    o.value = r; o.textContent = r;
    sel.appendChild(o);
  });
}

function applyFilters(){
  const region    = document.getElementById('f-region').value;
  const service   = document.getElementById('f-service').value;
  const minRating = parseInt(document.getElementById('f-rating').value)||0;
  const bilingual = document.getElementById('f-bilingual').value;
  const search    = document.getElementById('search').value.toLowerCase().trim();

  let visible = 0;
  markers.forEach(({marker, tech})=>{
    const show =
      (!region    || tech.region === region) &&
      (!service   || tech.services.includes(service)) &&
      (tech.rating >= minRating) &&
      (!bilingual || tech.bilingual === bilingual) &&
      (!search    || tech.name.toLowerCase().includes(search));
    marker.setVisible(show);
    if(show) visible++;
  });
  document.getElementById('count-badge').textContent = `${visible} tech${visible===1?'':'s'} shown`;
}

async function initMap(){
  map = new google.maps.Map(document.getElementById('map'), {
    center: {lat: 37.5, lng: -95},
    zoom: 4,
    mapTypeControl: false,
    streetViewControl: false,
    fullscreenControl: true,
    styles: [
      {featureType:"poi",stylers:[{visibility:"off"}]},
      {featureType:"transit",stylers:[{visibility:"off"}]}
    ]
  });

  geocoder = new google.maps.Geocoder();

  document.getElementById('loading-msg').textContent = 'Fetching technician data...';
  allTechs = await loadData();

  if(allTechs.length === 0){
    document.getElementById('loading-msg').textContent = 'Error: Could not load sheet data. Check sharing settings.';
    return;
  }

  document.getElementById('loading-msg').textContent = `Loaded ${allTechs.length} technicians. Placing pins...`;
  populateRegions();

  markers = allTechs.map(t => makeMarker(t));
  await geocodeAll(markers);

  document.getElementById('loading').style.display = 'none';
  document.getElementById('count-badge').textContent = `${markers.length} techs shown`;

  ['f-region','f-service','f-rating','f-bilingual'].forEach(id=>{
    document.getElementById(id).addEventListener('change', applyFilters);
  });
  document.getElementById('search').addEventListener('input', applyFilters);

  map.addListener('click', ()=>{
    if(openInfoWindow){ openInfoWindow.close(); openInfoWindow=null; }
  });
}

window.initMap = initMap;
</script>

<script async defer
  src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDYd59Nq9q2ZA26IQdP0d_2N88HTIiMG1M&callback=initMap">
</script>
</body>
</html>
